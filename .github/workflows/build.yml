name: Platform builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: npm run test:meeting
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml --no-default-features --bin audio-diag
      - run: python scripts/test-analysis.py
      - run: npm run tauri -- build --no-bundle
      # Hardware acceptance is tracked separately in docs/M0-ACCEPTANCE.md.
